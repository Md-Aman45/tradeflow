<!DOCTYPE html>
<html>
<head>
    <title>Tradeflow - Live Stock Prices</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; background: #0f0f0f; color: #fff; }
        h1 { color: #00c896; }
        .status { padding: 8px 16px; border-radius: 4px; display: inline-block; margin-bottom: 20px; }
        .connected { background: #00c896; color: #000; }
        .disconnected { background: #ff4444; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1a1a1a; padding: 12px; text-align: left; color: #00c896; }
        td { padding: 12px; border-bottom: 1px solid #222; }
        .up { color: #00c896; }
        .down { color: #ff4444; }
    </style>
</head>
<body>
    <h1>Tradeflow — Live Stock Prices</h1>
    <div id="status" class="status disconnected">Disconnected</div>

    <table>
        <thead>
            <tr>
                <th>Symbol</th>
                <th>Company</th>
                <th>Price</th>
                <th>Change %</th>
                <th>Status</th>
                <th>Updated</th>
            </tr>
        </thead>
        <tbody id="stockTable">
            <tr><td colspan="6">Connecting...</td></tr>
        </tbody>
    </table>

    <script>
        const stocks = {};

        const socket = new SockJS('http://localhost:8080/ws');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function (frame) {
            document.getElementById('status').className = 'status connected';
            document.getElementById('status').innerText = 'Connected — Live';

            // Subscribe to all stock updates
            stompClient.subscribe('/topic/stocks', function (message) {
                const updates = JSON.parse(message.body);

                // Handle both single object and array
                const list = Array.isArray(updates) ? updates : [updates];

                list.forEach(stock => {
                    stocks[stock.stockId] = stock;
                });

                renderTable();
            });

            // Request current prices on connect
            stompClient.send('/app/subscribe-stocks', {}, {});

        }, function (error) {
            document.getElementById('status').className = 'status disconnected';
            document.getElementById('status').innerText = 'Disconnected';
        });

        function renderTable() {
            const tbody = document.getElementById('stockTable');
            const rows = Object.values(stocks).map(s => {
                const changeClass = s.changePercent >= 0 ? 'up' : 'down';
                const changeSign = s.changePercent >= 0 ? '+' : '';
                const time = new Date(s.updatedAt).toLocaleTimeString();
                return `
                    <tr>
                        <td><strong>${s.symbol}</strong></td>
                        <td>${s.companyName}</td>
                        <td>$${parseFloat(s.price).toFixed(2)}</td>
                        <td class="${changeClass}">${changeSign}${s.changePercent}%</td>
                        <td>${s.marketStatus}</td>
                        <td>${time}</td>
                    </tr>`;
            }).join('');
            tbody.innerHTML = rows || '<tr><td colspan="6">No stocks found</td></tr>';
        }
    </script>
</body>
</html>
